name: CI

on: [push, pull_request]
jobs:
  test_musl_gcc:
    name: "Test with with GCC/musl/libstdc++/BFD on Alpine Linux"
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - run: echo 'http://dl-cdn.alpinelinux.org/alpine/edge/testing' >> /etc/apk/repositories # only needed for wayfire-dev
      - run: |
          apk --no-cache add \
            git \
            g++ \
            binutils \
            pkgconf \
            meson \
            ninja \
            musl-dev \
            gtkmm4-dev \
            vala \
            gobject-introspection-dev \
            ddcutil \
            pulseaudio-dev \
            pipewire-dev \
            wireplumber-dev \
            libdbusmenu-glib-dev \
            alsa-lib-dev \
            yyjson-dev \
            linux-pam-dev \
            util-linux-login \
            openssl-dev \
            wayland-protocols \
            wayfire-dev \
            gtk4-layer-shell-dev

      - name: wf-shell
        uses: actions/checkout@v7
        with:
          repository: WayfireWM/wf-shell
          path: wf-shell
      - run: |
          cd wf-shell
          meson setup build --prefix=/usr
          ninja -v -C build
          ninja -v -C build install
  test_code_style:
    name: "Check code style with uncrustify"
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y git cmake gcc make
      - name: Build Uncrustify
        uses: actions/checkout@v7
        with:
          repository: ammen99/uncrustify
          path: uncrustify
      - run: |
          cd uncrustify
          mkdir build
          cd build
          cmake ..
          make
      - name: Run Uncrustify Check
        uses: actions/checkout@v7
        with:
          path: wf-shell
      - run: |
          cd wf-shell
          wget https://raw.githubusercontent.com/WayfireWM/wayfire/master/uncrustify.ini
          git ls-files | grep "hpp$\|cpp$" | xargs ../uncrustify/build/uncrustify -c uncrustify.ini --no-backup --replace
          git diff --exit-code
